<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntroduÃ§Ã£o - ExperiÃªncia Profissional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            width: 100vw;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .volume-control {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .volume-control:hover {
            background: rgba(0, 0, 0, 0.7);
            transform: scale(1.05);
        }

        .volume-icon {
            width: 24px;
            height: 24px;
            color: #fff;
        }

        .skip-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .skip-button {
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            opacity: 0;
            animation: fadeIn 1s ease 3s forwards;
        }

        .skip-button:hover {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        .branding {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 100;
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            transition: opacity 0.5s ease;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #fff;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Efeito de brilho sutil no botÃ£o de volume */
        .volume-control::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .volume-control:hover::after {
            opacity: 1;
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .volume-control {
                width: 44px;
                height: 44px;
                top: 20px;
                right: 20px;
            }
            
            .volume-icon {
                width: 20px;
                height: 20px;
            }
            
            .branding {
                font-size: 16px;
                top: 20px;
                left: 20px;
            }
            
            .skip-button {
                padding: 10px 20px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .volume-control {
                width: 40px;
                height: 40px;
                top: 15px;
                right: 15px;
            }
            
            .volume-icon {
                width: 18px;
                height: 18px;
            }
            
            .branding {
                font-size: 14px;
                top: 15px;
                left: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay">
        <div class="loader"></div>
    </div>
    
    <div class="video-container">
        <video id="intro-video" autoplay muted playsinline>
            <source src="intro.mp4" type="video/mp4">
            Seu navegador nÃ£o suporta o elemento de vÃ­deo.
        </video>
        
        <div class="branding">XBRGAMES</div>
        
        <div class="volume-control">
            <svg class="volume-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 8C15.5 8.5 16 9.5 16 11C16 12.5 15.5 13.5 15 14M18 6C19 7 20 9 20 11C20 13 19 15 18 16M3 15V9H7L12 4V20L7 15H3Z" 
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        
        <div class="skip-container">
            <button class="skip-button">Pular IntroduÃ§Ã£o</button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('intro-video');
            const volumeControl = document.querySelector('.volume-control');
            const volumeIcon = volumeControl.querySelector('.volume-icon');
            const loadingOverlay = document.querySelector('.loading-overlay');
            const skipButton = document.querySelector('.skip-button');
            
            // Estado inicial do volume
            let isMuted = true;
            
            // SVG para ícones de volume
            const volumeIcons = {
                on: `<path d="M15 8C15.5 8.5 16 9.5 16 11C16 12.5 15.5 13.5 15 14M18 6C19 7 20 9 20 11C20 13 19 15 18 16M3 15V9H7L12 4V20L7 15H3Z" 
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`,
                off: `<path d="M17 13L21 17M21 13L17 17M3 15V9H7L12 4V20L7 15H3Z" 
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`
            };
            
            // Configuração inicial
            video.muted = isMuted;
            
            // Evento de carregamento do vídeo
            video.addEventListener('loadeddata', function() {
                // Simula um pequeno atraso para mostrar o loading
                setTimeout(() => {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => {
                        loadingOverlay.style.display = 'none';
                    }, 500);
                }, 800);
            });
            
            // Tratamento de erro no carregamento do vídeo
            video.addEventListener('error', function() {
                loadingOverlay.innerHTML = '<div class="loader"></div><p>Erro ao carregar o vídeo. Redirecionando...</p>';
                setTimeout(redirectToMainPage, 2000);
            });
            
            // Evento de término do vídeo
            video.addEventListener('ended', redirectToMainPage);
            
            // Controle de volume
            volumeControl.addEventListener('click', function() {
                isMuted = !isMuted;
                video.muted = isMuted;
                
                // Atualiza o ícone e ARIA label
                volumeIcon.innerHTML = isMuted ? volumeIcons.off : volumeIcons.on;
                volumeControl.setAttribute('aria-label', isMuted ? 'Ativar som' : 'Desativar som');
                
                // Efeito de feedback
                volumeControl.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    volumeControl.style.transform = 'scale(1)';
                }, 200);
            });
            
            // Botão de pular
            skipButton.addEventListener('click', redirectToMainPage);
            
            // Redirecionamento
            function redirectToMainPage() {
                document.body.style.opacity = '0';
                
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 600);
            }
            
            // Suporte para tecla de espaço para alternar volume
            document.addEventListener('keydown', function(e) {
                if (e.code === 'Space') {
                    e.preventDefault();
                    volumeControl.click();
                }
                // Tecla "S" também funciona para pular
                else if (e.code === 'KeyS') {
                    skipButton.click();
                }
            });
            
            // Prevenir comportamento padrão do espaço quando o vídeo está em foco
            video.addEventListener('keydown', function(e) {
                if (e.code === 'Space') {
                    e.preventDefault();
                }
            });
        });
    </script></body>
</html>
